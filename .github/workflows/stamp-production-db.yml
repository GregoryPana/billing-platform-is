name: stamp-production-db

# One-time, manually triggered production database operation. This writes only
# the Alembic baseline marker (no application DDL), but it is still protected
# exactly like deployment and requires a validated backup first.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type STAMP-PRODUCTION to proceed'
        required: true

permissions:
  contents: read

concurrency:
  group: billing-production-deploy
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: [self-hosted, billing]
    environment: production
    timeout-minutes: 30
    env:
      DEPLOY_ROOT: /opt/billing
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRMATION: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "STAMP-PRODUCTION" ]; then
            echo "Confirmation input did not match STAMP-PRODUCTION; aborting." >&2
            exit 1
          fi

      - name: Checkout trusted main into throwaway directory
        uses: actions/checkout@v4
        with:
          ref: main
          path: stamp-checkout
          fetch-depth: 1
          persist-credentials: false

      - name: Install backend dependencies into throwaway venv
        run: |
          set -euo pipefail
          cd stamp-checkout/backend
          python3 -m venv .venv-stamp
          ./.venv-stamp/bin/pip install --upgrade pip
          ./.venv-stamp/bin/pip install -r requirements.txt

      - name: Resolve one exact Alembic head and require an unstamped database
        id: schema
        env:
          DATABASE_URL: ${{ secrets.BILLING_DATABASE_URL }}
        run: |
          set -euo pipefail
          cd stamp-checkout/backend
          mapfile -t heads < <(./.venv-stamp/bin/alembic heads --resolve-dependencies | awk '/^[[:xdigit:]]+[[:space:]]/{print $1}')
          if (( ${#heads[@]} != 1 )); then
            echo "Expected exactly one Alembic head, found ${#heads[@]}" >&2
            exit 1
          fi
          current="$(./.venv-stamp/bin/alembic current | awk '/^[[:xdigit:]]+[[:space:]]/{print $1}')"
          if [ -n "$current" ]; then
            echo "Database is already stamped at a revision; refusing to overwrite its migration state" >&2
            exit 1
          fi
          echo "revision=${heads[0]}" >> "$GITHUB_OUTPUT"

      - name: Create and validate pre-stamp PostgreSQL backup
        id: backup
        env:
          DATABASE_URL: ${{ secrets.BILLING_DATABASE_URL }}
          REVISION: ${{ steps.schema.outputs.revision }}
        run: |
          set -euo pipefail
          python3 stamp-checkout/scripts/deployment/backup_postgres.py \
            --output-dir "${DEPLOY_ROOT}/backups" \
            --revision "$REVISION" \
            --github-output "$GITHUB_OUTPUT"

      - name: Stamp the exact reviewed revision
        env:
          DATABASE_URL: ${{ secrets.BILLING_DATABASE_URL }}
          REVISION: ${{ steps.schema.outputs.revision }}
        run: |
          set -euo pipefail
          cd stamp-checkout/backend
          ./.venv-stamp/bin/alembic stamp "$REVISION"

      - name: Verify exact stamped revision
        env:
          DATABASE_URL: ${{ secrets.BILLING_DATABASE_URL }}
          REVISION: ${{ steps.schema.outputs.revision }}
        run: |
          set -euo pipefail
          cd stamp-checkout/backend
          current="$(./.venv-stamp/bin/alembic current | awk '/^[[:xdigit:]]+[[:space:]]/{print $1}')"
          if [ "$current" != "$REVISION" ]; then
            echo "Database revision does not match the exact stamped revision" >&2
            exit 1
          fi

      - name: Write non-secret stamp evidence
        if: always()
        env:
          REVISION: ${{ steps.schema.outputs.revision }}
          BACKUP_PATH: ${{ steps.backup.outputs.backup_path }}
        run: |
          {
            echo "operation=production-alembic-baseline-stamp"
            echo "revision=${REVISION:-unresolved}"
            echo "backup_path=${BACKUP_PATH:-not-created}"
            echo "actor=${{ github.actor }}"
            echo "run_id=${{ github.run_id }}"
            echo "result=${{ job.status }}"
          } > stamp_metadata.txt

      - name: Upload stamp evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stamp-production-metadata-${{ github.run_id }}
          path: stamp_metadata.txt
          if-no-files-found: error
          retention-days: 90

      - name: Clean up throwaway checkout
        if: always()
        run: rm -rf -- stamp-checkout
