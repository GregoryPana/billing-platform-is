name: ci

# CI only ever tests. Production deployment is a separate, manual-only
# workflow (deploy-production.yml, workflow_dispatch-only) that resolves
# an operator-chosen ref to one immutable commit SHA and deploys exactly
# that SHA - this workflow never deploys or mutates any host.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing
          POSTGRES_DB: billing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Backend smoke check
        run: |
          cd backend
          python -m py_compile app/main.py

      - name: Alembic single-head check
        run: |
          cd backend
          alembic heads --resolve-dependencies | tee /tmp/alembic_heads.txt
          test "$(wc -l < /tmp/alembic_heads.txt)" -eq 1

      - name: Backend tests
        env:
          TEST_DATABASE_URL: "postgresql+psycopg://billing:billing@localhost:5432/billing"
          AUTH_MODE: local
        run: |
          cd backend
          pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Frontend build
        run: |
          cd frontend
          npm run build

      - name: Deployment script tests (unit, no host access)
        run: |
          set -e
          python -m pip install -r scripts/deployment/requirements-test.txt
          python -m pytest -q scripts/deployment/tests
          for t in scripts/deployment/tests/*.sh; do
            echo "--- running $t ---"
            bash "$t"
          done
