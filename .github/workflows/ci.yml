name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backend smoke check
        run: |
          cd backend
          python -m py_compile app/main.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Frontend build
        run: |
          cd frontend
          npm run build

  deploy:
    runs-on: [self-hosted, billing]
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Ensure repo at /opt/billing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ -d /opt/billing/.git ]; then
            git -C /opt/billing fetch --prune
            git -C /opt/billing checkout main
            git -C /opt/billing pull --ff-only
          else
            git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git /opt/billing
          fi

      - name: Write backend env
        run: |
          cat > /opt/billing/backend/.env <<'EOF'
          APP_NAME="Billing Platform API"
          ENVIRONMENT="production"
          DATABASE_URL="${{ secrets.BILLING_DATABASE_URL }}"
          TIMEZONE_OFFSET_HOURS=4
          N8N_WEBHOOK_URL="${{ secrets.BILLING_N8N_WEBHOOK_URL }}"
          N8N_APPROVAL_WEBHOOK_URL="${{ secrets.BILLING_N8N_APPROVAL_WEBHOOK_URL }}"
          N8N_SIGNUP_WEBHOOK_URL="${{ secrets.BILLING_N8N_SIGNUP_WEBHOOK_URL }}"
          N8N_SIGNUP_APPROVE_WEBHOOK_URL="${{ secrets.BILLING_N8N_SIGNUP_APPROVE_WEBHOOK_URL }}"
          N8N_WEBHOOK_VERIFY=${{ secrets.BILLING_N8N_WEBHOOK_VERIFY || true }}
          JWT_SECRET="${{ secrets.BILLING_JWT_SECRET }}"
          JWT_EXP_MINUTES=${{ secrets.BILLING_JWT_EXP_MINUTES || 480 }}
          EOF

      - name: Write frontend env
        run: |
          cat > /opt/billing/frontend/.env.production <<'EOF'
          VITE_API_URL=${{ secrets.BILLING_API_URL }}
          VITE_APPROVAL_WEBHOOK_URL=${{ secrets.BILLING_APPROVAL_WEBHOOK_URL }}
          EOF

      - name: Build frontend
        run: |
          cd /opt/billing/frontend
          npm ci
          npm run build

      - name: Install backend deps
        run: |
          cd /opt/billing/backend
          python3 -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -r requirements.txt

      - name: Restart billing API
        run: sudo systemctl restart billing-api

      - name: Emit deployment metadata
        env:
          APP_NAME: billing-platform
          ENVIRONMENT: production
        run: |
          echo "app_name=${APP_NAME}" | tee deploy_metadata.txt
          echo "version=${GITHUB_SHA}" | tee -a deploy_metadata.txt
          echo "deploy_timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a deploy_metadata.txt
          echo "environment=${ENVIRONMENT}" | tee -a deploy_metadata.txt
          echo "health_status=unknown" | tee -a deploy_metadata.txt

      - name: Upload deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: deploy_metadata
          path: deploy_metadata.txt
