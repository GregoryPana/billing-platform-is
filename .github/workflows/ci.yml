name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing
          POSTGRES_DB: billing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Backend smoke check
        run: |
          cd backend
          python -m py_compile app/main.py

      - name: Alembic single-head check
        run: |
          cd backend
          alembic heads --resolve-dependencies | tee /tmp/alembic_heads.txt
          test "$(wc -l < /tmp/alembic_heads.txt)" -eq 1

      - name: Backend tests
        env:
          TEST_DATABASE_URL: "postgresql+psycopg://billing:billing@localhost:5432/billing"
        run: |
          cd backend
          pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Frontend build
        run: |
          cd frontend
          npm run build

  deploy:
    runs-on: [self-hosted, billing]
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Checkout deploy commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync repo to /opt/billing
        run: |
          set -e
          mkdir -p /opt/billing
          rsync -a --delete \
            --exclude ".git/" \
            --exclude "backend/.env" \
            --exclude "backend/.venv/" \
            --exclude "**/__pycache__/" \
            --exclude "**/*.pyc" \
            --exclude "frontend/.env.production" \
            --exclude "frontend/node_modules/" \
            --exclude "frontend/dist/" \
            ./ /opt/billing/

      - name: Write backend env
        run: |
          cat > /opt/billing/backend/.env <<'EOF'
          APP_NAME="Billing Platform API"
          ENVIRONMENT="production"
          DATABASE_URL="${{ secrets.BILLING_DATABASE_URL }}"
          TIMEZONE_OFFSET_HOURS=4
          N8N_WEBHOOK_URL="${{ secrets.BILLING_N8N_WEBHOOK_URL }}"
          N8N_APPROVAL_WEBHOOK_URL="${{ secrets.BILLING_N8N_APPROVAL_WEBHOOK_URL }}"
          N8N_SIGNUP_WEBHOOK_URL="${{ secrets.BILLING_N8N_SIGNUP_WEBHOOK_URL }}"
          N8N_SIGNUP_APPROVE_WEBHOOK_URL="${{ secrets.BILLING_N8N_SIGNUP_APPROVE_WEBHOOK_URL }}"
          N8N_WEBHOOK_VERIFY=${{ secrets.BILLING_N8N_WEBHOOK_VERIFY || true }}
          JWT_SECRET="${{ secrets.BILLING_JWT_SECRET }}"
          JWT_EXP_MINUTES=${{ secrets.BILLING_JWT_EXP_MINUTES || 480 }}
          ENTRA_ENABLED=${{ secrets.BILLING_ENTRA_ENABLED || false }}
          ENTRA_TENANT_ID="${{ secrets.BILLING_ENTRA_TENANT_ID }}"
          ENTRA_CLIENT_ID="${{ secrets.BILLING_ENTRA_CLIENT_ID }}"
          ENTRA_AUTHORITY="${{ secrets.BILLING_ENTRA_AUTHORITY }}"
          ENTRA_ISSUER="${{ secrets.BILLING_ENTRA_ISSUER }}"
          ENTRA_AUDIENCE="${{ secrets.BILLING_ENTRA_AUDIENCE }}"
          ENTRA_JWKS_URL="${{ secrets.BILLING_ENTRA_JWKS_URL }}"
          ENTRA_FINANCE_GROUP_ID="${{ secrets.BILLING_ENTRA_FINANCE_GROUP_ID }}"
          ENTRA_BILLING_GROUP_ID="${{ secrets.BILLING_ENTRA_BILLING_GROUP_ID }}"
          ENTRA_SYSTEM_ADMIN_GROUP_ID="${{ secrets.BILLING_ENTRA_SYSTEM_ADMIN_GROUP_ID }}"
          EOF

      - name: Write frontend env
        run: |
          cat > /opt/billing/frontend/.env.production <<'EOF'
          VITE_API_URL=${{ secrets.BILLING_API_URL }}
          VITE_APPROVAL_WEBHOOK_URL=${{ secrets.BILLING_APPROVAL_WEBHOOK_URL }}
          VITE_ENTRA_ENABLED=${{ secrets.BILLING_ENTRA_ENABLED || false }}
          VITE_ENTRA_TENANT_ID=${{ secrets.BILLING_ENTRA_TENANT_ID }}
          VITE_ENTRA_CLIENT_ID=${{ secrets.BILLING_ENTRA_CLIENT_ID }}
          VITE_ENTRA_AUTHORITY=${{ secrets.BILLING_ENTRA_AUTHORITY }}
          VITE_ENTRA_API_SCOPE=${{ secrets.BILLING_ENTRA_API_SCOPE }}
          VITE_ENTRA_REDIRECT_URI=${{ secrets.BILLING_ENTRA_REDIRECT_URI }}
          VITE_ENTRA_POST_LOGOUT_REDIRECT_URI=${{ secrets.BILLING_ENTRA_POST_LOGOUT_REDIRECT_URI }}
          EOF

      - name: Build frontend
        run: |
          cd /opt/billing/frontend
          npm ci
          npm run build

      - name: Install backend deps
        run: |
          cd /opt/billing/backend
          python3 -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -r requirements.txt

      - name: Run database migrations
        run: |
          cd /opt/billing/backend
          ./.venv/bin/alembic upgrade head
          ./.venv/bin/alembic current

      - name: Restart billing API
        run: sudo systemctl restart billing-api

      - name: Wait for service health
        run: |
          for i in $(seq 1 15); do
            if sudo systemctl is-active --quiet billing-api; then
              echo "health_status=active" > /tmp/health_status.txt
              exit 0
            fi
            sleep 2
          done
          echo "health_status=inactive" > /tmp/health_status.txt
          echo "billing-api did not report active after restart" >&2
          exit 1

      - name: Emit deployment metadata
        env:
          APP_NAME: billing-platform
          ENVIRONMENT: production
        run: |
          METADATA_FILE="${GITHUB_WORKSPACE}/deploy_metadata.txt"
          echo "app_name=${APP_NAME}" | tee "${METADATA_FILE}"
          echo "version=${GITHUB_SHA}" | tee -a "${METADATA_FILE}"
          echo "deploy_timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a "${METADATA_FILE}"
          echo "environment=${ENVIRONMENT}" | tee -a "${METADATA_FILE}"
          cat /tmp/health_status.txt | tee -a "${METADATA_FILE}"
          (cd /opt/billing/backend && ./.venv/bin/alembic current) | tee -a "${METADATA_FILE}"

      - name: Upload deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: deploy_metadata
          path: deploy_metadata.txt
